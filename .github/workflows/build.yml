name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release:
    uses: risa-labs-inc/BossConsole-Releases/.github/workflows/plugin-release.yml@main
    with:
      # 'latest', as every plugin repo does. The api is additive-only (apiCheck gates it), so
      # latest is always >= the manifest's 1.0.89 floor, and a pin would
      # mean hand-bumping every plugin repo on each api release.
      boss_plugin_api_version: 'latest'
    secrets:
      BOSS_STORE_PLUGIN_PUBLISH_KEY: ${{ secrets.BOSS_STORE_PLUGIN_PUBLISH_KEY }}
